discovery:
  gdelt:
    enabled: true
    endpoint: https://api.gdeltproject.org/api/v2/doc/doc
    max_records: 250
    query: >
      ("semiconductor" OR "semiconductors" OR "chipmaker" OR "chip factory"
      OR "wafer fab" OR "advanced packaging" OR "HBM" OR "chip export controls")
  google_news:
    # Optional fallback. Disabled because results often use aggregator URLs
    # instead of canonical publisher URLs.
    enabled: false
    language: en
    country: SG
    queries:
      - semiconductor industry when:1d
      - chip export controls when:1d
      - semiconductor fab investment when:1d
      - HBM advanced packaging when:1d

quality:
  allow_unlisted_publishers: false

