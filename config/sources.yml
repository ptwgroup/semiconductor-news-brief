discovery:
  gdelt:
    enabled: true
    endpoint: https://api.gdeltproject.org/api/v2/doc/doc
    max_records: 250
    query: >
      ("semiconductor" OR "semiconductors" OR "chipmaker" OR "chip factory"
      OR "wafer fab" OR "mature node" OR "legacy node" OR "specialty CMOS"
      OR "analog semiconductor" OR "mixed signal" OR "power semiconductor"
      OR "silicon carbide" OR "gallium nitride" OR "MEMS" OR "sensor fab"
      OR "IGBT" OR "MOSFET" OR "microcontroller" OR "200mm fab"
      OR "semiconductor packaging" OR "wafer-level packaging" OR "fan-out"
      OR "redistribution layer" OR "die attach" OR "wire bond" OR "underfill"
      OR "package warpage" OR "front-end process" OR "wafer cleaning"
      OR "dry etch" OR "deposition" OR "ion implantation" OR "CMP"
      OR "process control" OR "wafer metrology" OR "defect inspection")
  google_news:
    # Optional fallback. Disabled because results often use aggregator URLs
    # instead of canonical publisher URLs.
    enabled: false
    language: en
    country: SG
    queries:
      - semiconductor industry when:1d
      - chip export controls when:1d
      - semiconductor fab investment when:1d
      - HBM advanced packaging when:1d
      - mature node analog power semiconductor when:1d
      - MEMS sensor semiconductor when:1d
      - SiC GaN IGBT MOSFET when:1d
      - semiconductor packaging RDL die attach wire bond warpage when:1d
      - semiconductor front-end etch deposition cleaning CMP metrology when:1d

